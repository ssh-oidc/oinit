# CA configuration for the compose demo stack (see demo.yaml).
#
# Copy into the oinit-ca container:
#   docker compose cp demo-ca-config.ini oinit-ca:/etc/oinit/ca-config.ini
#   docker compose restart oinit-ca

listen-address = 0.0.0.0:8082

host-ca-privkey = /etc/oinit/host-ca
host-ca-pubkey  = /etc/oinit/host-ca.pub
user-ca-privkey = /etc/oinit/user-ca
user-ca-pubkey  = /etc/oinit/user-ca.pub

cert-validity = 21600
cert-validity-fallback = 1800

# Hostgroup: the demo SSH appliance listens on host port 2222; users log in
# as principal "oinit", which the CA resolves through motley_cue
# (the all-in-one appliance, backend=local_unix).
[demo]
localhost = http://motley-cue:8080
