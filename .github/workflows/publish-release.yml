# This workflow will create a new Github release whenever a tag following
# semantic versioning is pushed to the master branch.

on:
  push:
    tags:
      - v*.*.*

name: Create Release

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # Make sure the tag was pushed to master
      - name: Verify release tag is on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Set up Go
        uses: actions/setup-go@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_TARGET: github

      - name: Upload Homebrew cask
        run: |
          cask="$(find results -type f -path '*/Casks/oinit.rb' -print -quit)"
          test -n "$cask"
          gh release upload "$GITHUB_REF_NAME" "$cask" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
