# This workflow will create a new Github release whenever a tag following
# semantic versioning is pushed to the main branch.

on:
  push:
    tags:
      - v*.*.*

name: Create Release

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get branch
        run: |
          raw=$(git branch -r --contains "$GITHUB_REF")
          branch=${raw/origin\/}
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      # Make sure tag was pushed to main branch
      - name: Check branch
        if: endsWith(env.BRANCH, 'main') == false
        run: |
          gh run cancel ${{ github.run_id }}
          gh run watch ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
