name: Publish container images

# Builds and publishes the container images for all targets of
# container/Dockerfile (oinit-ca, oinit-sshd, oinit) to Docker Hub.
# Replaces the goreleaser dockers bullet, which was limited to oinit-ca,
# single-arch, and published only latest/semver tags.

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - oinit-ca
          - oinit-sshd
          - oinit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sshoidc/${{ matrix.target }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # workflow_dispatch builds (no tag) still get a usable tag:
            type=sha,prefix=sha-,format=short

      - name: Resolve version build arg
        id: ver
        run: |
          ref="${GITHUB_REF_NAME#v}"
          echo "version=$ref" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OINIT_VERSION=${{ steps.ver.outputs.version }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
